<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Student - Student Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <h1>🎓 Student Management System</h1>
    <div class="nav-right">
        <span id="welcome-user"></span>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div class="form-card">
        <h2>Add New Student</h2>
        <div id="alert-box" class="alert alert-error"></div>
        <form id="student-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="roll_no">Roll No *</label>
                    <input type="text" id="roll_no" required>
                </div>
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="e.g. B.Tech CSE">
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" min="1" max="6">
                </div>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address">
            </div>
            <div class="form-actions">
                <a href="dashboard.html" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-primary">Save Student</button>
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/student_form.js"></script>
</body>
</html>
